[project]
name = "mem0-local-mcp"
version = "0.1.0"
description = "Local, API-key-free mem0 long-term memory for Claude Code (and any MCP client)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "mem0ai>=2.2,<3",
    "mcp>=1.2,<2",
    "chromadb>=1.0",
    "fastembed>=0.5",
]
keywords = ["mcp", "mem0", "claude-code", "memory", "local"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/ShmuelOps/mem0-local-mcp"

[project.scripts]
mem0-local-mcp = "mem0_local_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
